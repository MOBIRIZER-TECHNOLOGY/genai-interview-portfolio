[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short
markers =
    gpu: needs a CUDA GPU (embedding / model inference)
    llm: needs a running Ollama server (DeepEval judge)
    slow: takes more than a few seconds
    integration: exercises several projects together
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
